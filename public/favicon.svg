  <path d="M 50 4 A 46 46 0 0 1 96 50" fill="none" stroke="#D62828" stroke-width="7" stroke-linecap="round"/>
  <path d="M 96 50 A 46 46 0 0 1 50 96" fill="none" stroke="#1560D4" stroke-width="7" stroke-linecap="round"/>
  <path d="M 50 96 A 46 46 0 0 1 4 50" fill="none" stroke="#12181F" stroke-width="7" stroke-linecap="round"/>
  <path d="M 4 50 A 46 46 0 0 1 50 4" fill="none" stroke="#D62828" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Subtle Circuit Dots -->
  <circle cx="50" cy="18" r="2.5" fill="#D62828"/>
  <circle cx="82" cy="50" r="2.5" fill="#1560D4"/>
  <circle cx="50" cy="82" r="2.5" fill="#12181F"/>
  <circle cx="18" cy="50" r="2.5" fill="#D62828"/>

  <!-- ERC Wordmark Center -->
  <!-- Letter E (Red with circuit traces) -->
  <path d="M 24 38 L 36 38 M 24 38 L 24 62 L 36 62 M 24 50 L 33 50" fill="none" stroke="#D62828" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <circle cx="38" cy="38" r="1.8" fill="#D62828"/>
  <circle cx="35" cy="50" r="1.8" fill="#D62828"/>

  <!-- Letter R (Dark Navy) -->
  <path d="M 44 62 L 44 38 L 54 38 C 58 38 60 41 60 44 C 60 47 58 50 54 50 L 44 50 M 52 50 L 60 62" fill="none" stroke="#12181F" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Letter C (Blue Robotic Arm with Claw) -->
  <path d="M 76 42 L 68 38 C 64 38 62 43 62 50 C 62 57 64 62 68 62 L 76 58" fill="none" stroke="#1560D4" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Robotic Claw Finger Pins -->
  <circle cx="68" cy="38" r="2.5" fill="#12181F"/>
  <circle cx="76" cy="42" r="2" fill="#1560D4"/>
  <circle cx="76" cy="58" r="2" fill="#1560D4"/>
