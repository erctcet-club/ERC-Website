<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181F"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3649" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <g font-family="monospace" font-size="11" fill="#D62828" opacity="0.85">
    <text x="30" y="40">SYS_ID: UAV-HEX-01 // HEAVY_LIFT_MULTIROTOR</text>
    <text x="30" y="60">AUTOPILOT: PX4_FMUv5X // TELEMETRY_433MHZ</text>
    <text x="630" y="40">MAX_THRUST: 12.8 KGF</text>
    <text x="630" y="60">AIRFRAME: CARBON_3K</text>
  </g>

  <!-- Quadcopter / Multirotor Schematic -->
  <g transform="translate(400, 260)">
    <!-- Central Fuselage -->
    <polygon points="0,-45 40,-15 40,30 0,55 -40,30 -40,-15" fill="#1B2430" stroke="#D62828" stroke-width="2"/>
    <circle cx="0" cy="5" r="18" fill="#12181F" stroke="#1560D4" stroke-width="1.5"/>

    <!-- Carbon Arms -->
    <line x1="-30" y1="-25" x2="-160" y2="-120" stroke="#2A3649" stroke-width="8" stroke-linecap="round"/>
    <line x1="30" y1="-25" x2="160" y2="-120" stroke="#2A3649" stroke-width="8" stroke-linecap="round"/>
    <line x1="-30" y1="25" x2="-160" y2="120" stroke="#2A3649" stroke-width="8" stroke-linecap="round"/>
    <line x1="30" y1="25" x2="160" y2="120" stroke="#2A3649" stroke-width="8" stroke-linecap="round"/>

    <!-- Rotor Hubs & Propeller Arcs -->
    <!-- Top Left -->
    <circle cx="-160" cy="-120" r="16" fill="#12181F" stroke="#D62828" stroke-width="2"/>
    <ellipse cx="-160" cy="-120" rx="65" ry="18" fill="none" stroke="#D62828" stroke-width="1" stroke-dasharray="6,3" opacity="0.7"/>
    <!-- Top Right -->
    <circle cx="160" cy="-120" r="16" fill="#12181F" stroke="#1560D4" stroke-width="2"/>
    <ellipse cx="160" cy="-120" rx="65" ry="18" fill="none" stroke="#1560D4" stroke-width="1" stroke-dasharray="6,3" opacity="0.7"/>
    <!-- Bottom Left -->
    <circle cx="-160" cy="120" r="16" fill="#12181F" stroke="#1560D4" stroke-width="2"/>
    <ellipse cx="-160" cy="120" rx="65" ry="18" fill="none" stroke="#1560D4" stroke-width="1" stroke-dasharray="6,3" opacity="0.7"/>
    <!-- Bottom Right -->
    <circle cx="160" cy="120" r="16" fill="#12181F" stroke="#D62828" stroke-width="2"/>
    <ellipse cx="160" cy="120" rx="65" ry="18" fill="none" stroke="#D62828" stroke-width="1" stroke-dasharray="6,3" opacity="0.7"/>

    <!-- Front Heading Arrow -->
    <path d="M 0 -70 L 10 -55 L -10 -55 Z" fill="#D62828"/>
  </g>

  <!-- Framing Accents -->
  <path d="M 20 20 L 50 20 M 20 20 L 20 50" stroke="#D62828" stroke-width="2" fill="none"/>
  <path d="M 780 20 L 750 20 M 780 20 L 780 50" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 20 480 L 50 480 M 20 480 L 20 450" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 780 480 L 750 480 M 780 480 L 780 450" stroke="#D62828" stroke-width="2" fill="none"/>
</svg>
