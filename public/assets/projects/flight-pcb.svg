<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181F"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3649" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <g font-family="monospace" font-size="11" fill="#D62828" opacity="0.85">
    <text x="30" y="40">SYS_ID: PCB-FC-4L // 4-LAYER_FLIGHT_CONTROLLER</text>
    <text x="30" y="60">MCU: STM32F405RGT6 // IMU: ICM-42688-P</text>
    <text x="630" y="40">LAYERS: 4 ENIG</text>
    <text x="630" y="60">BARO: DPS310_I2C</text>
  </g>

  <!-- PCB Schematic Traces & Components -->
  <g transform="translate(400, 260)">
    <!-- Circuit Board Outline -->
    <rect x="-140" y="-120" width="280" height="240" rx="20" fill="#16202C" stroke="#1560D4" stroke-width="2.5"/>

    <!-- Mounting Holes -->
    <circle cx="-115" cy="-95" r="10" fill="#12181F" stroke="#D62828" stroke-width="2"/>
    <circle cx="115" cy="-95" r="10" fill="#12181F" stroke="#D62828" stroke-width="2"/>
    <circle cx="-115" cy="95" r="10" fill="#12181F" stroke="#D62828" stroke-width="2"/>
    <circle cx="115" cy="95" r="10" fill="#12181F" stroke="#D62828" stroke-width="2"/>

    <!-- Central Microcontroller QFP -->
    <rect x="-45" y="-45" width="90" height="90" rx="4" fill="#0B0F14" stroke="#2A3649" stroke-width="2"/>
    <text x="0" y="5" font-family="monospace" font-size="11" fill="#1560D4" text-anchor="middle" font-weight="bold">STM32</text>
    
    <!-- Copper PCB Traces -->
    <path d="M -45 -20 L -85 -20 L -100 -50" stroke="#1560D4" stroke-width="2" fill="none"/>
    <path d="M 45 -20 L 85 -20 L 100 -50" stroke="#1560D4" stroke-width="2" fill="none"/>
    <path d="M -45 20 L -85 20 L -100 50" stroke="#D62828" stroke-width="2" fill="none"/>
    <path d="M 45 20 L 85 20 L 100 50" stroke="#D62828" stroke-width="2" fill="none"/>

    <!-- IMU Chip -->
    <rect x="-20" y="-85" width="40" height="30" rx="2" fill="#12181F" stroke="#D62828" stroke-width="1.5"/>
    <text x="0" y="-66" font-family="monospace" font-size="8" fill="#D62828" text-anchor="middle">IMU</text>

    <!-- Solder Pads -->
    <rect x="-135" y="-30" width="12" height="60" fill="#D62828" opacity="0.8"/>
    <rect x="123" y="-30" width="12" height="60" fill="#1560D4" opacity="0.8"/>
  </g>

  <path d="M 20 20 L 50 20 M 20 20 L 20 50" stroke="#D62828" stroke-width="2" fill="none"/>
  <path d="M 780 20 L 750 20 M 780 20 L 780 50" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 20 480 L 50 480 M 20 480 L 20 450" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 780 480 L 750 480 M 780 480 L 780 450" stroke="#D62828" stroke-width="2" fill="none"/>
</svg>
