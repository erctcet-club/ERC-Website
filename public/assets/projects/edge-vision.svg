<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181F"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3649" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <g font-family="monospace" font-size="11" fill="#1560D4" opacity="0.85">
    <text x="30" y="40">SYS_ID: EDGE-AI-CAM // TENSORRT_JETSON_NODE</text>
    <text x="30" y="60">MODEL: YOLOV8_TINY // FPS: 42.6 @ 640x640</text>
    <text x="630" y="40">STEREO_DEPTH: ACTIVE</text>
    <text x="630" y="60">TRACKING: APRILTAGS</text>
  </g>

  <!-- Vision HUD Reticle & Detection Bounding Boxes -->
  <g transform="translate(400, 260)">
    <!-- Main Reticle -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1560D4" stroke-width="1.5" stroke-dasharray="10,5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2A3649" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#D62828"/>
    <line x1="-160" y1="0" x2="-20" y2="0" stroke="#1560D4" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="160" y2="0" stroke="#1560D4" stroke-width="1.5"/>
    <line x1="0" y1="-160" x2="0" y2="-20" stroke="#1560D4" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#1560D4" stroke-width="1.5"/>

    <!-- Detected Target Bounding Box 1 -->
    <rect x="-80" y="-70" width="160" height="140" fill="none" stroke="#D62828" stroke-width="2"/>
    <rect x="-80" y="-90" width="130" height="20" fill="#D62828"/>
    <text x="-75" y="-76" font-family="monospace" font-size="10" fill="#FFFFFF" font-weight="bold">TARGET_DRONE: 98.4%</text>

    <!-- Corner Bracket Markers -->
    <path d="M -90 -80 L -70 -80 M -90 -80 L -90 -60" stroke="#1560D4" stroke-width="2" fill="none"/>
    <path d="M 90 80 L 70 80 M 90 80 L 90 60" stroke="#1560D4" stroke-width="2" fill="none"/>
  </g>

  <path d="M 20 20 L 50 20 M 20 20 L 20 50" stroke="#D62828" stroke-width="2" fill="none"/>
  <path d="M 780 20 L 750 20 M 780 20 L 780 50" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 20 480 L 50 480 M 20 480 L 20 450" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 780 480 L 750 480 M 780 480 L 780 450" stroke="#D62828" stroke-width="2" fill="none"/>
</svg>
