<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181F"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3649" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <g font-family="monospace" font-size="11" fill="#D62828" opacity="0.85">
    <text x="30" y="40">SYS_ID: MANIP-6DOF // ARTICULATED_ROBOTIC_ARM</text>
    <text x="30" y="60">KINEMATICS: INVERSE_JACOBIAN // REPEATABILITY_0.2MM</text>
    <text x="630" y="40">DEGREES_FREEDOM: 6</text>
    <text x="630" y="60">PAYLOAD: 2.5 KG</text>
  </g>

  <!-- 6-DOF Robotic Arm Schematic -->
  <g transform="translate(360, 360)">
    <!-- Base Turntable -->
    <rect x="-80" y="-15" width="160" height="30" rx="6" fill="#1B2430" stroke="#1560D4" stroke-width="2"/>
    <circle cx="0" cy="-15" r="24" fill="#12181F" stroke="#2A3649" stroke-width="2"/>
    
    <!-- Link 1 (Shoulder) -->
    <line x1="0" y1="-15" x2="-40" y2="-120" stroke="#1560D4" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-40" cy="-120" r="18" fill="#12181F" stroke="#D62828" stroke-width="2.5"/>

    <!-- Link 2 (Elbow) -->
    <line x1="-40" y1="-120" x2="80" y2="-210" stroke="#2A3649" stroke-width="10" stroke-linecap="round"/>
    <circle cx="80" cy="-210" r="14" fill="#12181F" stroke="#1560D4" stroke-width="2"/>

    <!-- Link 3 (Wrist) -->
    <line x1="80" y1="-210" x2="160" y2="-180" stroke="#D62828" stroke-width="7" stroke-linecap="round"/>
    <circle cx="160" cy="-180" r="10" fill="#1B2430" stroke="#D62828" stroke-width="2"/>

    <!-- End Effector Gripper -->
    <path d="M 160 -180 L 190 -195 L 205 -185" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 160 -180 L 190 -165 L 205 -175" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <path d="M 20 20 L 50 20 M 20 20 L 20 50" stroke="#D62828" stroke-width="2" fill="none"/>
  <path d="M 780 20 L 750 20 M 780 20 L 780 50" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 20 480 L 50 480 M 20 480 L 20 450" stroke="#1560D4" stroke-width="2" fill="none"/>
  <path d="M 780 480 L 750 480 M 780 480 L 780 450" stroke="#D62828" stroke-width="2" fill="none"/>
</svg>
